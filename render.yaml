# Render Blueprint for the TalentPulse testing server (Render Free plan).
# No LinkedIn cookies are set here: searches run in each tester's own browser through the extension.
#
# CANDIDATE DATA IS KEPT IN A FREE NEON POSTGRES DATABASE (DATABASE_URL), so it survives restarts,
# spin-downs and redeploys. Render Free's own disk is temporary: without DATABASE_URL the app falls back
# to a SQLite file there, which is wiped whenever the service restarts or is redeployed.
services:
  - type: web
    name: talentpulse
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: PYTHONUTF8
        value: "1"
      - key: TZ                       # timestamps in India time, as on the testers' computers (the dashboard reads them as local time)
        value: Asia/Kolkata
      - key: TALENTPULSE_HOSTED       # turns off dry runs, the raw payload log and /docs
        value: "1"
      - key: TALENTPULSE_SMTP_CHECK   # cloud hosts block port 25; emails are found but not mail-server checked
        value: "0"
      - key: DATABASE_URL             # Neon connection string; a secret, entered in the Render dashboard (never in Git)
        sync: false
